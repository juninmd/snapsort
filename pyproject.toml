[project]
name = "snapsort"
version = "1.0.0"
description = "Organize a messy folder of photos/files into YYYY/MM by capture date (EXIF, falling back to mtime), with hash-based dedupe."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["photos", "exif", "organize", "dedupe", "cli"]
dependencies = ["typer>=0.12"]

[project.optional-dependencies]
exif = ["pillow>=10.0"]

[project.scripts]
snapsort = "snapsort.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snapsort"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer's declarative API intentionally calls Option/Argument in defaults.
"src/snapsort/cli.py" = ["B008"]
